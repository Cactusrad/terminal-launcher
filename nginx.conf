server {
    # Default vhost HTTP : redirige vers HTTPS pour accès direct sur LAN
    listen 80 default_server;
    return 301 https://$host$request_uri;
}

# Vhost dédié terminal.sharpi.ca : entrée via Cloudflare → droplet nginx →
# tunnel SSH .200:9103. Le TLS est géré côté droplet (Let's Encrypt) + CF Access
# fait l'auth Pierre uniquement. Ici on reçoit du HTTP propre via le tunnel,
# pas de redirect HTTPS sinon boucle (le request arrive déjà via HTTPS public).
server {
    listen 80;
    server_name terminal.sharpi.ca;

    location /terminal-ws/ {
        proxy_pass http://host.docker.internal:7681/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /terminal-api/ {
        proxy_pass http://host.docker.internal:7681/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://terminal-launcher:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ttyd webterminal (tmux session "webterminal", port hôte 9021) exposé en HTTPS.
# En HTTP nu (http://.200:9021) le navigateur bloque navigator.clipboard, donc la
# copie via OSC 52 (Claude Code / tmux) n'atterrit jamais. En contexte sécurisé
# (https://.200:9443) elle fonctionne. ttyd reste servi à la racine -> pas besoin
# de --base-path, tout (/, /token, /ws) est proxifié à la racine.
server {
    listen 9443 ssl;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://host.docker.internal:9021;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

# Vhost LAN avec vrai certificat Let's Encrypt (terminal.local.sharpi.ca -> A
# 192.168.1.200, DNS-only chez Cloudflare, cert émis en DNS-01 par acme.sh côté
# user `cactus`, renouvelé par son propre cron). Motif : le cert auto-signé du
# bloc 443 par défaut oblige à cliquer « Continuer quand même » dans Chrome, et
# cette exception EXPIRE au bout d'une semaine — au moment où elle tombe, toute
# nouvelle connexion TLS est refusée : les WebSockets des terminaux meurent en
# boucle (ERR_CERT_AUTHORITY_INVALID) alors que la page, servie du cache, semble
# vivante. Incident du 6 août 2026. Le bloc par défaut ci-dessous reste en
# auto-signé pour l'accès direct par IP.
server {
    listen 443 ssl;
    server_name terminal.local.sharpi.ca;

    ssl_certificate /etc/nginx/certs/le-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/le-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /terminal-ws/ {
        proxy_pass http://host.docker.internal:7681/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /terminal-api/ {
        proxy_pass http://host.docker.internal:7681/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://terminal-launcher:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl default_server;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Terminal WebSocket proxy (wss:// -> ws://host:7681)
    location /terminal-ws/ {
        proxy_pass http://host.docker.internal:7681/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Terminal server REST API proxy (sessions endpoint)
    location /terminal-api/ {
        proxy_pass http://host.docker.internal:7681/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Main app
    location / {
        proxy_pass http://terminal-launcher:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
